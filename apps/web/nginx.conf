# Servidor da SPA na imagem de produção (apps/web/Dockerfile): substitui o default.conf da imagem
# oficial do nginx. O React Router em modo data (ADR-0004) resolve as rotas no navegador, então
# qualquer caminho sem arquivo correspondente devolve o index.html (fallback), e o 404 fica a
# cargo da página de erro da SPA. Os assets do Vite têm hash no nome e podem ficar em cache por
# um ano; o index.html não, para o deploy novo valer na próxima recarga.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sem a versão do nginx no cabeçalho Server nem nas páginas de erro.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
