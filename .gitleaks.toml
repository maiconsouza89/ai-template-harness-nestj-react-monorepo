# Configuração do gitleaks, lida automaticamente da raiz por `gitleaks git .` (make check-secrets).
# Estende as regras padrão do binário; nada é desativado.
[extend]
useDefault = true

# Cookies de sessão inventados (sem assinatura) da evidência de API-BORDA-03 em
# docs/features/fundacao/avaliacao.md, que o item usa para provar o 401; não são segredo.
# O contrato não fixa o valor, e a evaluator o troca a cada avaliação; por isso o padrão aceita
# qualquer valor que comece com "inventado" (por exemplo inventado123.abcdef), e só naquele
# arquivo (condição AND). Valor sem esse prefixo continua acusado: ou ele é mascarado na
# evidência (relatorio.md da evaluator), ou o prefixo vale. Não depende do SHA do commit:
# o fingerprint do .gitleaksignore leva o SHA, que o squash do PR troca.
[[rules]]
id = "generic-api-key"

    [[rules.allowlists]]
    description = "cookie inventado da evidência de API-BORDA-03"
    condition = "AND"
    paths = ['''^docs/features/fundacao/avaliacao\.md$''']
    regexes = ['''^inventado[A-Za-z0-9._-]*$''']

    # IDs de item do contrato (por exemplo API-TROCA-05, E2E-INTEGRACAO-01) nas listas "Usado por"
    # de um contract.md, que a regra toma por chave. Só nos contract.md das features (condição AND)
    # e só um valor inteiro na forma SIGLA-...-NN, em maiúsculas; qualquer outro valor nesses
    # arquivos continua acusado. Pelo padrão, não pelo SHA, porque o squash do PR troca o SHA.
    [[rules.allowlists]]
    description = "IDs de item do contrato em docs/features/*/contract.md"
    condition = "AND"
    paths = ['''^docs/features/[^/]+/contract\.md$''']
    regexes = ['''^[A-Z0-9]+(?:-[A-Z0-9]+)*-[0-9]{2}$''']
